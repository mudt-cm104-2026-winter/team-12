<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Booking</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Room Booking</h1>
    <p class="intro">Book a room for your group.</p>

    <form class="add" action="/add" method="post">
      <input name="room" placeholder="Room" required autocomplete="off" autofocus>
      <input name="group" placeholder="Group name" required autocomplete="off">
      <button type="submit">Add</button>
    </form>

    {% if entries %}
    <table>
      <thead>
        <tr><th>Room</th><th>Group</th></tr>
      </thead>
      <tbody>
        {% for entry in entries %}
        <tr><td>{{ entry.room }}</td><td>{{ entry.group }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="empty">Nothing here yet.</p>
    {% endif %}
  </main>
</body>
</html>
